[project]
name = "osmaddresssystem"
version = "0.1.0"
description = "Turn an OpenStreetMap road network into an address system: street identities, numbering, names, signs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "geopandas",
    "shapely",
    "requests",
    "osmnx",
    "osm2geojson",
    "pandas",
    "rapidfuzz",
    "geopy",
    "folium>=0.20.0",
    "python-igraph>=1.0.0",
]

[project.optional-dependencies]
planning = [
    "scipy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osmaddresssystem"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
notebook = [
    "ipykernel>=7.3.0",
    "ipyleaflet>=0.20.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
]
